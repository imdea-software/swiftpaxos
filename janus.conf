// Janus example: 6 replicas, 2 shards of 3 replicas (replicasPerShard: 3).
// Local deployment: every participant is on the loopback device, with its own port.

-- Replicas --
r0 127.0.0.1
r1 127.0.0.2
r2 127.0.0.3
r3 127.0.0.4
r4 127.0.0.5
r5 127.0.0.6

-- Clients --
c0 127.0.1.1

-- Master --
m 127.0.2.1

masterPort: 7090

protocol: janus
replicasPerShard: 3
txnSize: 2

reqs: 1000
writes: 50
conflicts: 10
commandSize: 16
key: 42
clones: 0

-- Apply to r0 --
port: 7100
-- Apply to r1 --
port: 7101
-- Apply to r2 --
port: 7102
-- Apply to r3 --
port: 7103
-- Apply to r4 --
port: 7104
-- Apply to r5 --
port: 7105
-- Stop --

-- Proxy --
server_alias r0
c0 (local)

server_alias r1
server_alias r2
server_alias r3
server_alias r4
server_alias r5
---
